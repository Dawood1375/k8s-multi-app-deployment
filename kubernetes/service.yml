apiVersion: v1
kind: Service
metadata: { name: shop-svc, namespace: nginx }
spec:
  type: ClusterIP
  selector: { app: shop }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: nginx-page-svc, namespace: nginx }
spec:
  type: ClusterIP
  selector: { app: nginx-page }
  ports: [{ port: 80, targetPort: 80 }]
