apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
      - name: shop
        image: dawoodashraf/ecommerce-shop:v1
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 80 }]
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        livenessProbe:
          httpGet: { path: /health, port: 80 }
          initialDelaySeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 80 }
          initialDelaySeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-page
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels: { app: nginx-page }
  template:
    metadata:
      labels: { app: nginx-page }
    spec:
      containers:
      - name: nginx-page
        image: dawoodashraf/my-nginx-app:v1
        ports: [{ containerPort: 80 }]
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits:   { cpu: 100m, memory: 64Mi }
        livenessProbe:
          httpGet: { path: /, port: 80 }
        readinessProbe:
          httpGet: { path: /, port: 80 }
